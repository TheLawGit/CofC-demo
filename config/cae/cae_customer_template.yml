---
controller_templates:
  - name: "CAE - Push Updates to Customers"
    description: "Job template to push software versions to customers"
    image: "Default execution environment" # ee-supported-rhel9:latest # Execution environment
    inventory: "AAP2"
    project: "gitea-aap1"
    playbook: "dispatch.yml"
    job_type: "run"
    organization: "Default"
    #become_enabled: true
    credentials: "AAP2 Admin"
    extra_vars:
      aap_request_timeout: 60
      aap_configuration_async_delay: 3
    survey_enabled: true
    "{{ lookup('template', 'template_surveys/cae_customers.json') | regex_replace('\\n', '') }}"
